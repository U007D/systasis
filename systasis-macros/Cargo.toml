[package]
name = "systasis-macros"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Procedural macros for systasis"
publish = false

[lib]
proc-macro = true

[features]
resolve_unchecked = []

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.4", features = ["full", "visit-mut"] }

[lints]
workspace = true
