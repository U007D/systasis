[package]
name = "systasis-contract-fixture"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
systasis = { path = "../../..", default-features = false }

[features]
std = ["systasis/std"]
bad-copy-error = []
bad-poison-in-no-std = []
bad-fallible = []
bad-send-guard = []
bad-send-mut-guard = []
bad-guard-escape = []
bad-sync-cell-guard = []
bad-reserved-escape = []
bad-move-reserved-slot = []
bad-sync-cell-slot = []
bad-send-rc-slot = []
bad-send-cell-reader = []
bad-mutable-lifetime = []
